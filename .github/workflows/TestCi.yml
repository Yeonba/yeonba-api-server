name: Yeonba Backend DEV CI

on:
  pull_request:
    branches: [ "dev" ]

env:
  WORKING_DIRECTORY: ./

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set application properties
        run: |
          touch be/src/main/resources/application.properties
          echo "${{ secrets.APPLICATION_PROPERTIES_DEV }}" > be/src/main/resources/application.properties

      - name: Test with Gradle
        run: |
          chmod +x ./be/gradlew
          ./be/gradlew test
        env:
          WORKING_DIRECTORY: ${{ env.WORKING_DIRECTORY }}